<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc">
  <title id="title">Cindy Lou system architecture</title>
  <desc id="desc">Discord voice and text flow through the local voice bridge and OpenClaw agent; memory is stored in workspace files and campaign memory services; a manually triggered session closeout can publish reviewed updates to GitHub Pages.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#53677d"/></marker>
    <marker id="dashArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8292a5"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172334}
      .title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#526276}
      .lane{font-size:18px;font-weight:700}.node{font-size:16px;font-weight:650}.small{font-size:13px;fill:#526276}.tiny{font-size:12px;fill:#526276}
      .box{stroke-width:1.5;rx:12}.arrow{fill:none;stroke:#53677d;stroke-width:2;marker-end:url(#arrow)}
      .dotted{fill:none;stroke:#8292a5;stroke-width:1.7;stroke-dasharray:6 6;marker-end:url(#dashArrow)}
    </style>
  </defs>
  <rect width="1600" height="1110" fill="#ffffff"/>
  <text x="48" y="54" class="title">Cindy Lou: services, data, and session closeout</text>
  <text x="48" y="82" class="subtitle">Verified snapshot · 2026-10-21 · running service ≠ active game-session connection</text>

  <!-- Top-level functional lanes -->
  <rect x="35" y="112" width="300" height="525" rx="18" fill="#f3f6fa" stroke="#ccd6e1"/>
  <text x="58" y="147" class="lane">Discord surfaces</text>
  <rect class="box" x="62" y="180" width="246" height="84" fill="#e8f0ff" stroke="#9bb8eb"/>
  <text x="185" y="213" text-anchor="middle" class="node">Players and GM</text>
  <text x="185" y="239" text-anchor="middle" class="small">voice, chat, mentions, commands</text>
  <rect class="box" x="62" y="315" width="246" height="74" fill="#e8f0ff" stroke="#9bb8eb"/>
  <text x="185" y="346" text-anchor="middle" class="node">Voice channel</text>
  <text x="185" y="369" text-anchor="middle" class="small">live audio when bridge joins</text>
  <rect class="box" x="62" y="435" width="246" height="74" fill="#e8f0ff" stroke="#9bb8eb"/>
  <text x="185" y="466" text-anchor="middle" class="node">Session thread</text>
  <text x="185" y="489" text-anchor="middle" class="small">transcripts and text replies</text>
  <rect class="box" x="62" y="545" width="246" height="64" fill="#fff4df" stroke="#e5c47b"/>
  <text x="185" y="573" text-anchor="middle" class="node">Ordinary text / mentions</text>
  <text x="185" y="594" text-anchor="middle" class="tiny">legacy text bot is not running</text>

  <rect x="365" y="112" width="405" height="525" rx="18" fill="#f0f8f5" stroke="#b9d7cc"/>
  <text x="388" y="147" class="lane">Local Discord voice bridge</text>
  <text x="388" y="170" class="small">Process present; latest saved session is ended / disconnected</text>
  <rect class="box" x="397" y="205" width="145" height="82" fill="#dff2e9" stroke="#8dc3a7"/>
  <text x="469" y="238" text-anchor="middle" class="node">Audio receive</text>
  <text x="469" y="262" text-anchor="middle" class="small">Discord voice</text>
  <rect class="box" x="584" y="205" width="150" height="82" fill="#dff2e9" stroke="#8dc3a7"/>
  <text x="659" y="238" text-anchor="middle" class="node">faster-whisper</text>
  <text x="659" y="262" text-anchor="middle" class="small">local speech-to-text</text>
  <path class="arrow" d="M542 246 H579"/>
  <rect class="box" x="415" y="337" width="320" height="80" fill="#dff2e9" stroke="#8dc3a7"/>
  <text x="575" y="369" text-anchor="middle" class="node">Transcript / thread watcher</text>
  <text x="575" y="393" text-anchor="middle" class="small">posts text; watches active-thread asks</text>
  <path class="arrow" d="M659 287 V321 H575 V332"/>
  <rect class="box" x="397" y="467" width="145" height="82" fill="#fff0dd" stroke="#e3b779"/>
  <text x="469" y="500" text-anchor="middle" class="node">Kokoro TTS</text>
  <text x="469" y="524" text-anchor="middle" class="small">automatic speech off</text>
  <rect class="box" x="584" y="467" width="150" height="82" fill="#fff0dd" stroke="#e3b779"/>
  <text x="659" y="500" text-anchor="middle" class="node">Manual playback</text>
  <text x="659" y="524" text-anchor="middle" class="small">saved clips enabled</text>
  <path class="arrow" d="M542 508 H579"/>
  <text x="565" y="588" text-anchor="middle" class="small">voice wake is configured off by default</text>

  <rect x="800" y="112" width="325" height="525" rx="18" fill="#f5f1fb" stroke="#d0c2e5"/>
  <text x="823" y="147" class="lane">OpenClaw agent runtime</text>
  <rect class="box" x="832" y="213" width="261" height="98" fill="#ebe2f7" stroke="#b49bd5"/>
  <text x="963" y="251" text-anchor="middle" class="node">Reasoning and response</text>
  <text x="963" y="277" text-anchor="middle" class="small">SR3 help, campaign context, chat</text>
  <rect class="box" x="832" y="375" width="261" height="91" fill="#ebe2f7" stroke="#b49bd5"/>
  <text x="963" y="411" text-anchor="middle" class="node">Memory search / recall</text>
  <text x="963" y="437" text-anchor="middle" class="small">continuity files and indexed sources</text>
  <path class="arrow" d="M963 311 V369"/>
  <text x="963" y="520" text-anchor="middle" class="small">text replies return to Discord</text>
  <text x="963" y="546" text-anchor="middle" class="small">voiced lines use the optional manual path</text>

  <rect x="1155" y="112" width="410" height="525" rx="18" fill="#f2f7fb" stroke="#bdd0df"/>
  <text x="1178" y="147" class="lane">Memory and knowledge stores</text>
  <rect class="box" x="1183" y="185" width="354" height="92" fill="#e4f0f8" stroke="#9bbbd0"/>
  <text x="1360" y="218" text-anchor="middle" class="node">Workspace continuity files</text>
  <text x="1360" y="243" text-anchor="middle" class="small">USER.md · PARTY_DOSSIER.md · memory/</text>
  <rect class="box" x="1183" y="316" width="354" height="92" fill="#e4f0f8" stroke="#9bbbd0"/>
  <text x="1360" y="349" text-anchor="middle" class="node">Memory API :8091 · healthy</text>
  <text x="1360" y="374" text-anchor="middle" class="small">Carbonite cleaned campaign-memory data</text>
  <rect class="box" x="1183" y="447" width="354" height="92" fill="#e4f0f8" stroke="#9bbbd0"/>
  <text x="1360" y="480" text-anchor="middle" class="node">Knowledge wiki :8889</text>
  <text x="1360" y="505" text-anchor="middle" class="small">service responds; browser access login-gated</text>
  <text x="1360" y="576" text-anchor="middle" class="small">Raw SR3 books: Google Drive · source code: project repo</text>
  <text x="1360" y="602" text-anchor="middle" class="tiny">Service health is confirmed; direct integration with agent recall is unverified</text>

  <!-- Cross-lane runtime flow -->
  <path class="arrow" d="M185 264 V309"/>
  <path class="arrow" d="M308 349 H386"/>
  <path class="arrow" d="M735 378 H823"/>
  <text x="778" y="364" text-anchor="middle" class="tiny">direct ask</text>
  <path class="arrow" d="M832 270 H780 V435 H320 V473"/>
  <text x="570" y="428" text-anchor="middle" class="tiny">text answer</text>
  <path class="arrow" d="M308 577 H819 V270 H827"/>
  <path class="dotted" d="M963 311 V460 H741 V506"/>
  <text x="951" y="337" class="tiny">memory lookup</text>
  <path class="dotted" d="M1093 420 H1177"/>
  <path class="dotted" d="M1093 420 H1139 V495 H1177"/>
  <text x="1104" y="398" class="tiny">integration unverified</text>

  <!-- Session transcript and manual publication route -->
  <rect x="35" y="675" width="1530" height="375" rx="18" fill="#fbfaf6" stroke="#ded7c5"/>
  <text x="58" y="712" class="lane">After the game: manual closeout, then reviewed wiki publication</text>
  <text x="58" y="737" class="small">Transcript JSONL is a local record in addition to the Discord thread; packet creation alone does not edit or publish the wiki.</text>

  <rect class="box" x="70" y="790" width="225" height="95" fill="#fff4df" stroke="#e5c47b"/>
  <text x="182" y="827" text-anchor="middle" class="node">transcript.jsonl</text>
  <text x="182" y="852" text-anchor="middle" class="small">workspace runtime / archive</text>
  <rect class="box" x="350" y="790" width="230" height="95" fill="#fff4df" stroke="#e5c47b"/>
  <text x="465" y="827" text-anchor="middle" class="node">cindy-session-closeout</text>
  <text x="465" y="852" text-anchor="middle" class="small">operator runs manually</text>
  <rect class="box" x="635" y="790" width="220" height="95" fill="#fff4df" stroke="#e5c47b"/>
  <text x="745" y="827" text-anchor="middle" class="node">Evidence packet</text>
  <text x="745" y="852" text-anchor="middle" class="small">summary + wiki context</text>
  <rect class="box" x="910" y="790" width="220" height="95" fill="#ebe2f7" stroke="#b49bd5"/>
  <text x="1020" y="827" text-anchor="middle" class="node">Configured local agent</text>
  <text x="1020" y="852" text-anchor="middle" class="small">drafts the wiki sweep</text>
  <rect class="box" x="1185" y="790" width="155" height="95" fill="#e7f3e8" stroke="#a6c8a9"/>
  <text x="1262" y="827" text-anchor="middle" class="node">Git repo</text>
  <text x="1262" y="852" text-anchor="middle" class="small">review / commit</text>
  <rect class="box" x="1390" y="790" width="145" height="95" fill="#e7f3e8" stroke="#a6c8a9"/>
  <text x="1462" y="827" text-anchor="middle" class="node">GitHub Pages</text>
  <text x="1462" y="852" text-anchor="middle" class="small">published wiki</text>
  <path class="arrow" d="M295 837 H344"/><path class="arrow" d="M580 837 H629"/><path class="arrow" d="M855 837 H904"/><path class="arrow" d="M1130 837 H1179"/><path class="arrow" d="M1340 837 H1384"/>
  <rect class="box" x="350" y="930" width="780" height="70" fill="#f1f4f8" stroke="#c5d0dc"/>
  <text x="740" y="960" text-anchor="middle" class="node">GM canon / date checks and operator review</text>
  <text x="740" y="983" text-anchor="middle" class="small">Optional wrapper commit/push runs only after closeout checks; not an automatic voice-session action.</text>
  <path class="dotted" d="M740 930 V894 H1020 V890"/>
  <text x="59" y="1025" class="tiny">Data at rest: session logs / captures / caches on local or Carbonite storage · wiki source in the Cindy project repo · raw rulebooks on Google Drive</text>
</svg>
